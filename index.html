<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vitamin VVV</title>
<meta name="description" content="Vitamin VVV makes rain-to-wear. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400&display=swap">
<style>
html, body { margin: 0; padding: 0; }
/* Layout: one photograph of the first sample fills the screen; the name and "Coming soon" sit on it, contact lines underneath. */
:root {
  --paper: #f2f3f1;
  --ink: #2b2f33;
  --mist: #7d858c;
  --rule: #d7dad8;
  --on-photo: #ffffff;
  --shade: rgba(20, 24, 28, .55);
  --sans: "Josefin Sans", "Helvetica Neue", Arial, sans-serif;
  --serif: "Josefin Sans", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-weight: 300; font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.hero { position: relative; overflow: hidden; height: 100svh; min-height: 560px; max-width: 100%; }
.hero .photo { position: absolute; inset: 0; width: 100%; height: 100%; max-width: 100%; object-fit: cover; object-position: 42% 50%; }
@media (max-width: 759px) { .hero .photo { object-position: 72% 50%; } }
.hero::after { pointer-events: none; content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--shade) 0%, rgba(20,24,28,.18) 38%, rgba(20,24,28,0) 60%), linear-gradient(to bottom, rgba(20,24,28,.22) 0%, rgba(20,24,28,0) 22%); }
.hero .inner {
  pointer-events: none;
  position: relative; z-index: 1; height: 100%;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-block: 28px 24px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  color: var(--on-photo);
}
@media (min-width: 760px) { .hero .inner { padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: max(48px, env(safe-area-inset-right, 0px)); padding-block: 36px 32px; } }
.mark { margin: 0; font-weight: 300; font-size: 22px; letter-spacing: .14em; text-transform: lowercase; }
.soon { display: grid; gap: 10px; }
.soon h1 { margin: 0; font-weight: 200; font-size: clamp(52px, 10vw, 132px); line-height: .95; letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
.soon .cat { margin: 0 0 4px; font-family: var(--sans); font-style: normal; font-weight: 300; font-size: clamp(18px, 2.2vw, 28px); letter-spacing: .32em; text-transform: uppercase; line-height: 1.2; }
.soon p { margin: 0; font-family: var(--serif); font-style: normal; font-weight: 300; font-size: clamp(18px, 2vw, 26px); line-height: 1.35; letter-spacing: .02em; }
.bottom { display: grid; gap: 28px; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 10px 32px; font-size: 14px; letter-spacing: .06em; color: var(--on-photo); opacity: .9; }
.foot .links { display: flex; flex-wrap: wrap; gap: 8px 28px; min-width: 0; pointer-events: auto; }
.foot a { display: inline-flex; align-items: center; gap: 8px; color: var(--on-photo); text-decoration: none; min-width: 0; }
.foot a span { border-bottom: 1px solid rgba(255,255,255,.5); overflow-wrap: anywhere; }
.foot a:hover span { border-color: var(--on-photo); }
.foot .ic { width: 18px; height: 18px; flex: none; }
.foot a:focus-visible { outline: 2px solid var(--on-photo); outline-offset: 3px; }
</style>
</head>
<body>

<section class="hero">
  <img class="photo" src="sleeve.jpg" alt="Close-up of a translucent white sleeve with clear flower details">
  <div class="inner">
    <p class="mark">Vitamin VVV</p>
    <div class="bottom">
    <div class="soon">
      <p class="cat">Rain-to-wear</p>
      <h1>Coming soon</h1>
      <p>Rain to shine.</p>
    </div>
    <div class="foot">
      <span>&copy; 2026 Vitamin VVV</span>
      <span class="links">
        <a href="https://www.instagram.com/vitaminvvv.studio/" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/></svg><span>@vitaminvvv.studio</span></a>
        <a href="mailto:nihao@vitaminvvv.studio"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.8 6.5 12 13l8.2-6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>nihao@vitaminvvv.studio</span></a>
      </span>
    </div>
    </div>
  </div>
</section>
</body>
</html>
