<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vitamin VVV</title>
<meta name="description" content="Vitamin VVV makes rain-to-wear. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400&display=swap">
<style>
html, body { margin: 0; padding: 0; }
/* Layout: one photograph of the first sample fills the screen; the name and "Coming soon" sit on it, contact lines underneath. */
:root {
  --paper: #f2f3f1;
  --ink: #2b2f33;
  --mist: #7d858c;
  --rule: #d7dad8;
  --on-photo: #ffffff;
  --shade: rgba(20, 24, 28, .55);
  --sans: "Josefin Sans", "Helvetica Neue", Arial, sans-serif;
  --serif: "Josefin Sans", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-weight: 300; font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.hero { position: relative; overflow: hidden; height: 100svh; min-height: 560px; max-width: 100%; }
.hero .photo { position: absolute; inset: 0; width: 100%; height: 100%; max-width: 100%; object-fit: cover; object-position: 42% 50%; }
@media (max-width: 759px) { .hero .photo { object-position: 72% 50%; } }
.hero::after { pointer-events: none; content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--shade) 0%, rgba(20,24,28,.18) 38%, rgba(20,24,28,0) 60%), linear-gradient(to bottom, rgba(20,24,28,.22) 0%, rgba(20,24,28,0) 22%); }
.hero .inner {
  pointer-events: none;
  position: relative; z-index: 1; height: 100%;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-block: 28px 24px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  color: var(--on-photo);
}
@media (min-width: 760px) { .hero .inner { padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: max(48px, env(safe-area-inset-right, 0px)); padding-block: 36px 32px; } }
.mark { margin: 0; font-weight: 300; font-size: 22px; letter-spacing: .14em; text-transform: lowercase; }
.soon { display: grid; gap: 10px; }
.soon h1 { margin: 0; font-weight: 200; font-size: clamp(52px, 10vw, 132px); line-height: .95; letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
.soon .cat { margin: 0 0 4px; font-family: var(--sans); font-style: normal; font-weight: 300; font-size: clamp(18px, 2.2vw, 28px); letter-spacing: .32em; text-transform: uppercase; line-height: 1.2; }
.soon p { margin: 0; font-family: var(--serif); font-style: normal; font-weight: 300; font-size: clamp(18px, 2vw, 26px); line-height: 1.35; letter-spacing: .02em; }
.bottom { display: grid; gap: 28px; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 10px 32px; font-size: 14px; letter-spacing: .06em; color: var(--on-photo); opacity: .9; }
.foot .links { display: flex; flex-wrap: wrap; gap: 8px 28px; min-width: 0; pointer-events: auto; }
.foot a { display: inline-flex; align-items: center; gap: 8px; color: var(--on-photo); text-decoration: none; min-width: 0; }
.foot a span { border-bottom: 1px solid rgba(255,255,255,.5); overflow-wrap: anywhere; }
.foot a:hover span { border-color: var(--on-photo); }
.foot .ic { width: 18px; height: 18px; flex: none; }
.foot a:focus-visible { outline: 2px solid var(--on-photo); outline-offset: 3px; }

/* Opening: a grey, rainy view of the sleeve clears into colour and light, then the words arrive. Plays once; skipped for reduced motion or on tap. */
.hero .sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero .photo { transition: filter 1.8s ease, transform 3.2s cubic-bezier(.2,.7,.2,1); }
.hero .glow { position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(60% 50% at 78% 18%, rgba(255,214,236,.55), rgba(255,236,200,.22) 45%, rgba(255,255,255,0) 72%);
  transition: opacity 2.2s ease; }
.rain .hero .photo { filter: grayscale(.9) brightness(.62) contrast(.92) blur(1.5px); transform: scale(1.06); }
.rain .hero .mark, .rain .hero .soon > *, .rain .hero .foot { opacity: 0; transform: translateY(14px); }
.hero .mark, .hero .soon > *, .hero .foot { transition: opacity 1.1s ease, transform 1.4s cubic-bezier(.2,.7,.2,1); }
.shine .hero .photo { filter: none; transform: none; }
.shine .hero .glow { opacity: 1; }
.shine .hero .soon .cat { transition-delay: .5s; }
.shine .hero .soon h1 { transition-delay: .8s; }
.shine .hero .soon p:last-child { transition-delay: 1.2s; }
.shine .hero .mark, .shine .hero .foot { transition-delay: 1.6s; }
.hero .glow::before { content: ""; position: absolute; inset: -20% -60%; opacity: 0;
  background: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,226,242,.55) 47%, rgba(255,250,228,.7) 50%, rgba(220,210,255,.45) 53%, rgba(255,255,255,0) 60%);
  transform: translateX(-60%); }
.shine .hero .glow::before { animation: sweep 2.4s .2s cubic-bezier(.3,.6,.3,1) both; }
@keyframes sweep { 0% { opacity: 0; transform: translateX(-60%); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateX(60%); } }
.done .hero .glow { opacity: .55; }
</style>
<script>if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("rain");</script>
</head>
<body>

<section class="hero">
  <img class="photo" src="sleeve.jpg" alt="Close-up of a translucent white sleeve with clear flower details">
  <canvas class="sky" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>
  <div class="inner">
    <p class="mark">Vitamin VVV</p>
    <div class="bottom">
    <div class="soon">
      <p class="cat">Rain-to-wear</p>
      <h1>Coming soon</h1>
      <p>Wear whatever you want, whatever the weather.</p>
    </div>
    <div class="foot">
      <span>&copy; 2026 Vitamin VVV</span>
      <span class="links">
        <a href="https://www.instagram.com/vitaminvvv.studio/" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/></svg><span>@vitaminvvv.studio</span></a>
        <a href="mailto:nihao@vitaminvvv.studio"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.8 6.5 12 13l8.2-6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>nihao@vitaminvvv.studio</span></a>
      </span>
    </div>
    </div>
  </div>
</section>
<script>
(() => {
  const root = document.documentElement;
  if (!root.classList.contains("rain")) return;
  const hero = document.querySelector(".hero"), cv = hero.querySelector(".sky"), ctx = cv.getContext("2d");
  let W, H, dpr;
  const size = () => { dpr = Math.min(devicePixelRatio || 1, 2); W = hero.clientWidth; H = hero.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  size(); addEventListener("resize", size);
  const R = Math.random, RAIN = 2400, CLEAR = 1600, SPARKLE = 3200;
  const streak = () => ({ x: R() * (W + 200) - 100, y: -R() * H, l: 14 + R() * 26, v: 0.9 + R() * 0.8, a: 0.18 + R() * 0.32 });
  const streaks = Array.from({ length: Math.round(W * H / 5200) + 60 }, () => { const s = streak(); s.y = R() * H; return s; });
  // Drops resting on the glass; they catch the light when the rain stops.
  const beads = Array.from({ length: Math.round(W * H / 26000) + 14 }, () => ({ x: R() * W, y: R() * H, r: 2 + R() * 6, p: R() * 6.28 }));
  const tints = ["255,196,225", "217,200,255", "255,241,184", "200,236,255", "255,255,255"];
  const sparks = beads.filter(() => R() < .85).map(b => ({ x: b.x + (R() - .5) * 8, y: b.y - b.r * .4, s: 12 + R() * 22, d: R() * 900, c: tints[Math.floor(R() * tints.length)] }));
  const star = (x, y, s, c, o) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, s);
    g.addColorStop(0, `rgba(255,255,255,${o})`); g.addColorStop(.25, `rgba(${c},${o * .8})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g; ctx.beginPath();
    for (let i = 0; i < 8; i++) { const r = i % 2 ? s * .16 : s, t = i * Math.PI / 4 - Math.PI / 2; ctx.lineTo(x + Math.cos(t) * r, y + Math.sin(t) * r); }
    ctx.closePath(); ctx.fill();
  };
  let t0 = null, shone = false, stop = false;
  const finish = () => { stop = true; root.classList.remove("rain"); root.classList.add("shine", "done"); ctx.clearRect(0, 0, W, H); };
  hero.addEventListener("pointerdown", finish, { once: true });
  const frame = now => {
    if (stop) return;
    t0 ??= now; const t = now - t0;
    if (!shone && t > RAIN) { shone = true; root.classList.remove("rain"); root.classList.add("shine"); }
    ctx.clearRect(0, 0, W, H);
    const rain = t < RAIN ? 1 : Math.max(0, 1 - (t - RAIN) / CLEAR);
    if (rain > 0) {
      ctx.lineCap = "round"; ctx.lineWidth = 1.1;
      for (const s of streaks) {
        s.y += s.v * 16 * (0.5 + rain * .5); s.x -= s.v * 2.4;
        if (s.dead) continue;
        if (s.y - s.l > H) { if (R() < rain) Object.assign(s, streak()); else { s.dead = true; continue; } }
        ctx.strokeStyle = `rgba(225,232,240,${s.a * rain})`;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + s.l * .15, s.y - s.l); ctx.stroke();
      }
    }
    const beadA = t < RAIN + CLEAR ? 1 : Math.max(0, 1 - (t - RAIN - CLEAR) / SPARKLE);
    for (const b of beads) {
      const g = ctx.createRadialGradient(b.x - b.r * .3, b.y - b.r * .3, 0, b.x, b.y, b.r);
      g.addColorStop(0, `rgba(255,255,255,${.55 * beadA})`); g.addColorStop(.6, `rgba(220,228,236,${.16 * beadA})`); g.addColorStop(1, `rgba(255,255,255,${.05 * beadA})`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.29); ctx.fill();
    }
    if (t > RAIN) {
      for (const k of sparks) {
        const u = (t - RAIN - 300 - k.d) / 1500; if (u <= 0) continue;
        const o = Math.max(0, Math.sin(Math.min(u, 1) * Math.PI)) * (u < 1 ? 1 : 0) + (u >= 1 ? .5 * beadA * (.6 + .4 * Math.sin(t / 260 + k.d)) : 0);
        if (o > .01) star(k.x, k.y, k.s * (u < 1 ? .6 + .4 * Math.sin(u * Math.PI) : .7), k.c, Math.min(1, o));
      }
    }
    if (t > RAIN + CLEAR + SPARKLE) { finish(); return; }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
